[project]
name = "ai-campus-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yohanyes347", email = "yohanyes347@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
ai-campus-project = "ai_campus_project:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
